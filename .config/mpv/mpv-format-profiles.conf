# vim: set ft=conf noet:
[best]
ytdl-format=bv[vcodec^=avc1]+ba/best

[fhd]
ytdl-format=fhd/full/bv[vcodec^=avc1][height<=?1080][height>720]+ba/bv[height<=?1080]/bv[ext=mp4]+ba/best

[hd]
ytdl-format=22/high/bv[vcodec^=avc1][height<=?720][height>540]+ba/bv[height<=?720]/bv[ext=mp4]+ba/best

[hq]
ytdl-format=hq/fsd/std/bv[vcodec^=avc1][height<=?540][height>480]+ba/bv[height<=?540]/bv[ext=mp4]+ba/best

[fsd]
ytdl-format=fsd/std/bv[vcodec~='^(unknown|NA|avc1)'][height<=?480][height>360]+ba/b[vcodec~='^(unknown|NA|avc1)'][height<=?480][height>360]/b[height<=?480][height>360]/bv[height<=?480]/bv[ext=mp4]+ba/best

[sd]
ytdl-format=18/std/bv[vcodec^=avc1][height<=?360][height>240]+ba/bv[height<=?360]/bv[ext=mp4]+ba/best

[ld]
ytdl-format=ld/bv[vcodec^=avc1][height<=?240][height>144]+ba/bv[height<=?240]/bv[ext=mp4]+ba/best

[vld]
ytdl-format=vld/bv[vcodec^=avc1][height<=?144]+ba/bv[height<=?144]/bv[ext=mp4]+ba/best

